<style>

function loop(){if(state==='play')update();draw();t++;requestAnimationFrame(loop)}
const A=[72,0,76,0,79,76,0,74,72,0,69,0,67,0,0,0,69,0,72,0,76,72,0,71,67,0,71,0,74,0,0,0],Bm=[76,0,79,0,84,79,0,76,77,0,76,0,74,0,72,0,74,0,77,0,81,77,0,74,72,0,0,0,67,0,72,0],MEL=A.concat(Bm),BR=[48,45,41,43,48,41,43,48];
let ac,mg,step=0,nt=0,muted=0;const mu=document.getElementById('mu');
const nf=n=>440*Math.pow(2,(n-69)/12);
function tone(n,t0,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=nf(n);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+d+.02)}
function sched(){while(nt<ac.currentTime+.3){const i=step%64,m=MEL[i];if(m)tone(m,nt,.17,'square',.07);if(i%2==0){const r=BR[i>>3];tone(i%4==0?r:r+7,nt,.18,'triangle',.16)}nt+=.19;step++}}
function music(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:1;mg.connect(ac.destination);nt=ac.currentTime+.1;setInterval(sched,50)}else ac.resume()}catch(e){}}
function sfx(k){try{if(!ac)return;const t=ac.currentTime;if(k=='c'){tone(83,t,.09,'square',.12);tone(88,t+.08,.22,'square',.12)}else if(k=='h'){[60,55,50,44].forEach((n,i)=>tone(n,t+i*.09,.14,'sawtooth',.16))}else{tone(52,t,.08,'square',.14);tone(59,t+.06,.1,'square',.14)}}catch(e){}}
function setMute(){muted=!muted;if(mg)mg.gain.value=muted?0:1;mu.textContent=muted?'🔇':'♪'}
mu.onclick=()=>{setMute();mu.blur()};addEventListener('keydown',e=>{if(e.code=='KeyM')setMute()});
build();loop();
